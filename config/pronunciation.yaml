# Podcast pronunciation: written form -> how the voice should say it. Whole words, case-sensitive.
# A standalone capital A is read as the article "uh": spell the letter A as "eigh". (AI needs no entry: the voice already says it right.)
# Applied to the audio only (the transcript keeps the original). If something sounds wrong, add a line here.
replace:
  LLM: "L L M"
  LLMs: "L L Emz"
  AUROC: "eigh-you-rock"
  JAMIA: "Jam-ee-uh"
  NPJ: "N P J"
  VA: "V eigh"
  ASA: "eigh S eigh"
  HIV: "H I V"
  PrEP: "prep"
  OUD: "O U D"
  NIH: "N I H"
  NIDA: "Nye-duh"
  NIAID: "Nye-aid"
  NIAAA: "N I triple A"
  NIMH: "N I M H"
  NLM: "N L M"
  NIMHD: "N I M H D"
  CDC: "C D C"
  FDA: "F D A"
  SAMHSA: "Sam-zuh"
  HRSA: "Her-suh"
  RCT: "R C T"
  RCTs: "R C Tees"
  EHR: "E H R"
  EHRs: "E H Arz"
  NLP: "N L P"
  ML: "M L"
  GPT: "G P T"
  RAG: "rag"
  PubMed: "Pub Med"
